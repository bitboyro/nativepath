[package]
name = "np-db-postgres"
version = "0.1.0"
edition = "2021"
description = "NativePath PostgreSQL wire-protocol engine: blocking, text format, wipes protocol buffers after every statement"

[dependencies]
np-memory = { path = "../np-memory" }
postgres-protocol = "0.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = "0.11"

[dev-dependencies]
rcgen = "0.13"
