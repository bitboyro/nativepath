name: Release

# Builds the bundle on each platform and publishes a GitHub Release. Trigger: a pushed version tag
# (v0.1.0), or by hand with a version. The notes are the version's section of CHANGELOG.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the leading v (for example 0.1.0)
        required: true

permissions:
  contents: write
  packages: write

jobs:
  # The release needs the Docker check to pass: preflight, the memory proofs with their controls, a wiring
  # pass and the database experiment, inside the image. A failure leaves the tag in place and publishes
  # nothing; fix, delete the tag, tag again.
  docker-check:
    uses: ./.github/workflows/docker-check.yml

  bundle:
    name: Bundle (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, os: ubuntu-24.04 }
          - { platform: linux-aarch64, os: ubuntu-24.04-arm }
          - { platform: macos-arm64, os: macos-14 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          v="${{ inputs.version }}"
          [ -n "$v" ] || v="${GITHUB_REF_NAME#v}"
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      - uses: Swatinem/rust-cache@v2

      - name: Set the project version
        run: mvn -B -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      # No tests here: ci.yml runs the whole suite on the same push, and the Docker check below runs the
      # memory proofs and a wiring pass in the image.

      # Linux bundles are built inside the Rocky Linux 8 image, so libnativepath.so needs nothing newer than
      # glibc 2.28 and loads on RHEL-family and Ubuntu hosts alike. macOS builds natively.
      - name: Bundle (Linux, in Docker)
        if: runner.os == 'Linux'
        run: |
          . np-benchmarks/versions.env
          docker buildx build -f np-benchmarks/docker/Dockerfile --target bundle -o type=local,dest=dist \
            --build-arg BASE_IMAGE="$BASE_IMAGE" --build-arg JDK_MAJOR="$JDK_MAJOR" --build-arg RUST_VERSION="$RUST_VERSION" \
            --build-arg MAVEN_VERSION="$MAVEN_VERSION" --build-arg NP_VERSION="$VERSION" .
          ls -l dist

      - name: Bundle (macOS)
        if: runner.os == 'macOS'
        run: scripts/package-release.sh "$VERSION" dist

      # The bundle must run without Rust or Maven: unpack it away from the checkout, shadow cargo and
      # mvn with shims that fail, and run the quick memory proofs from it.
      - name: Check the bundle
        run: |
          d=$(mktemp -d)
          tar -xzf dist/np-$VERSION-${{ matrix.platform }}.tar.gz -C "$d"
          mkdir "$d/shim"
          for t in cargo mvn; do printf '#!/bin/sh\necho "the bundle must not call %s" >&2\nexit 99\n' "$t" > "$d/shim/$t"; chmod +x "$d/shim/$t"; done
          cd "$d"/np-$VERSION-${{ matrix.platform }}
          PATH="$d/shim:$PATH" ./np-bench check --only preflight,memory

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: dist/*

  # The benchmark image, for anyone with Docker: ghcr.io/bitboyro/np-bench:<version> (and :latest), one
  # build per architecture on a native runner, joined into one multi-arch tag. A public image pulls
  # without a login.
  image:
    needs: docker-check
    name: Image (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - { arch: amd64, os: ubuntu-24.04 }
          - { arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Build and push
        run: |
          v="${{ inputs.version }}"; [ -n "$v" ] || v="${GITHUB_REF_NAME#v}"
          . np-benchmarks/versions.env
          docker buildx build -f np-benchmarks/docker/Dockerfile --target runtime --push \
            -t ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/np-bench:$v-${{ matrix.arch }} \
            --build-arg BASE_IMAGE="$BASE_IMAGE" --build-arg JDK_MAJOR="$JDK_MAJOR" --build-arg RUST_VERSION="$RUST_VERSION" \
            --build-arg MAVEN_VERSION="$MAVEN_VERSION" --build-arg NP_VERSION="$v" .

  image-manifest:
    needs: image
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write }
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: One tag for both architectures
        run: |
          v="${{ inputs.version }}"; [ -n "$v" ] || v="${GITHUB_REF_NAME#v}"
          r=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/np-bench
          docker buildx imagetools create -t $r:$v -t $r:latest $r:$v-amd64 $r:$v-arm64

  publish:
    needs: [bundle, docker-check, image-manifest]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Only the bundles: the run also holds the Docker check's results, which are not release assets.
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true

      - name: Release notes from the changelog
        run: |
          v="${{ inputs.version }}"
          [ -n "$v" ] || v="${GITHUB_REF_NAME#v}"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          awk -v v="$v" '$0 ~ "^## " v "( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "No section '## $v' in CHANGELOG.md" >&2; exit 1; }
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/* --title "NativePath $VERSION" --notes-file notes.md
