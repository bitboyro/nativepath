name: CI

# Push only: a pull request shows the check from the push run of the same commit; adding a
# pull_request trigger would run everything twice for every push to a branch with an open PR.
on:
  push:

jobs:
  test:
    name: Rust and Java tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      - uses: Swatinem/rust-cache@v2

      - name: Build the native library
        run: cargo build --release -p np-ffi

      # Includes the memory scanner's self-test (plant a value, find it, wipe it, find nothing),
      # which proves the Linux scanner used by the residue scans works on this machine.
      - name: Rust tests
        run: cargo test --release --workspace

      # Reactor build: modules resolve from target/classes, never from a stale ~/.m2 snapshot.
      - name: Java tests
        run: mvn -B -q test

      - name: Keep test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
