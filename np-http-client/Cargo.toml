[package]
name = "np-http-client"
version = "0.1.0"
edition = "2021"

[dependencies]
np-memory = { path = "../np-memory" }
bytes = "1.6"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "net", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
